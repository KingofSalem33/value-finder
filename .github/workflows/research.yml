name: Research checks and collection

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    # Standard GitHub-hosted runners are free for public repositories.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r requirements-collector.txt
      - run: npm run test:collector
      - run: npm test
      - run: npm run typecheck
      - name: Collect source data
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: python scripts/collect.py
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - name: Refresh dated references
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: npm run refresh:references
      - name: Accept complete records
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: npm run build:records
      - run: npm run verify:records
      - run: python scripts/package-source.py
      - run: npm run build
      - name: Publish accepted data
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git add -- src/data public/filings public/source.zip
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh accepted SEC research records'
            git push origin HEAD:main
          fi
